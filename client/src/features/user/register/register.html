<div class="card bg-base-100 w-150 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
    <div class="card-title justify-center text-3xl text-primary">Sign up</div>
    <div class="card-body w-full">
        <ul class="steps">
            <li class="step step-primary">Credentials</li>
            <li class="step" [class.step-primary]="currentStep() === 2">Profile</li>
        </ul>
        @if (currentStep() === 1) {
            <form [formGroup]="credentialsForm" class="flex flex-col gap-5 w-full steps">
                <app-text-input class="mt-5" label="Email" formControlName="email"></app-text-input>
                <app-text-input label="Display name" formControlName="displayName"></app-text-input>
                <app-text-input label="Password" formControlName="password" type="password"></app-text-input>
                <app-text-input label="Confirm Password" formControlName="confirmPassword" type="password"></app-text-input>
                <div class="flex items-center justify-end gap-3">
                    <button (click)="cancel()" type="button" class="btn">Cancel</button>
                    <button [disabled]="!credentialsForm.valid" (click)="nextStep()" class="btn btn-primary"
                        type="button">Next</button>
                </div>
            </form>
        }

        @if (currentStep() === 2) {
            <form [formGroup]="profileForm" class="mt-5 flex flex-col w-full gap-5 steps">
                <div class="flex w-full flex-wrap items-center gap-4 rounded-box border border-base-300 bg-base-100 p-2">
                    <div class="font-semibold">Roles:</div>
                    <ul class="flex flex-wrap items-center gap-4 bg-base-100">
                        @for (role of roles(); track role.id) {
                            <li class="flex items-center" [attr.title]="role.description">
                                <label class="flex cursor-pointer items-center gap-3">
                                    <input
                                        type="radio"
                                        formControlName="roleId"
                                        [value]="role.id"
                                        class="radio radio-primary">
                                    <span class="font-semibold">{{role.name}}</span>
                                </label>
                            </li>
                        }
                    </ul>
                </div>
                <div class="flex w-full flex-col gap-4 rounded-box border border-base-300 bg-base-100 p-4">
                    <div class="flex w-full flex-wrap items-start gap-4">
                        <app-text-input class="w-full sm:w-1/3" label="House Number" formControlName="houseNumber"></app-text-input>
                        <app-text-input class="w-full sm:w-1/3" label="Zone/Purok" formControlName="zone"></app-text-input>
                    </div>
                    <app-text-input class="w-full" label="Barangay" formControlName="barangay"></app-text-input>
                    <div class="flex w-full flex-wrap items-start gap-4">
                        <app-text-input class="w-full sm:w-1/3" label="City" formControlName="city"></app-text-input>
                        <app-text-input class="w-full sm:w-1/3" label="Province" formControlName="province"></app-text-input>
                    </div>
                    <app-text-input
                        class="w-full sm:w-1/3"
                        type="tel"
                        label="Phone Number"
                        formControlName="phoneNumber"></app-text-input>
                </div>
                <div class="flex items-center justify-end gap-3">
                    <button (click)="prevStep()" type="button" class="btn">Back</button>
                    <button
                        [disabled]="!profileForm.valid" 
                        (click)="register()" 
                        class="btn btn-primary"
                        type="button">Register
                    </button>
                </div>
            </form>
        }
        
    </div>

    @if (validationErrors().length > 0) {
        <div class="mt-5 flex w-full max-w-full rounded-2xl bg-gray-200 p-3 mx-auto">
            <ul class="flex flex-col space-y-1 text-base text-error">
                @for (error of validationErrors(); track $index) {
                    <li>{{error}}</li>
                }
            </ul>
        </div>
    }
</div>
